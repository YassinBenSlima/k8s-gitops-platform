<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        header {
            padding: 24px 8%;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin: 8px 0 0;
            color: #6b7280;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .card {
            padding: 22px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 15px;
            color: #6b7280;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .tasks h2 {
            margin-bottom: 16px;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 18px;
            margin-bottom: 12px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .completed {
            background: #dcfce7;
            color: #166534;
        }

        footer {
            padding: 24px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Taskboard</h1>
        <p>Manage your tasks in one place.</p>
    </header>

    <main>
        <section class="summary">
            <div class="card">
                <h2>Total tasks</h2>
                <div class="number">4</div>
            </div>

            <div class="card">
                <h2>In progress</h2>
                <div class="number">2</div>
            </div>

            <div class="card">
                <h2>Completed</h2>
                <div class="number">2</div>
            </div>
        </section>

        <section class="tasks">
            <h2>Recent tasks</h2>

            <div class="task">
                <span>Configure Kubernetes cluster</span>
                <span class="status completed">Completed</span>
            </div>

            <div class="task">
                <span>Deploy FastAPI backend</span>
                <span class="status completed">Completed</span>
            </div>

            <div class="task">
                <span>Build frontend container</span>
                <span class="status pending">In progress</span>
            </div>

            <div class="task">
                <span>Configure GitOps deployment</span>
                <span class="status pending">In progress</span>
            </div>
        </section>
    </main>

    <footer>
        Taskboard — Kubernetes GitOps Lab
    </footer>
</body>
</html>
