name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/yassinbenslima/taskboard-frontend:latest
            ghcr.io/yassinbenslima/taskboard-frontend:sha-${{ github.sha }}
      - name: Update Kubernetes manifest
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: ghcr.io/yassinbenslima/taskboard-frontend:.*|image: ghcr.io/yassinbenslima/taskboard-frontend:sha-${GITHUB_SHA}|" k8s/base/frontend-deployment.yaml
      - name: Commit and push manifest update
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- k8s/base/frontend-deployment.yaml; then
            git add k8s/base/frontend-deployment.yaml
            git commit -m "chore(gitops): update frontend image to sha-${GITHUB_SHA} [skip ci]"
            git push
          else
            echo "No manifest changes detected."
          fi
