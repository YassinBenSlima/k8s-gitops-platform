apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-api
  labels:
    app: taskboard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-api
  template:
    metadata:
      labels:
        app: taskboard-api
    spec:
      containers:
        - name: backend
          image: taskboard-api:2.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"

          envFrom:
            - secretRef:
                name: postgres-secret

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
