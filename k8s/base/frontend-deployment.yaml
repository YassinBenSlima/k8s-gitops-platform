apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-frontend
  labels:
    app: taskboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-frontend
  template:
    metadata:
      labels:
        app: taskboard-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/yassinbenslima/taskboard-frontend:sha-0ee87ac1a5f8874b9dece8a0fcf4affa02bf40c7
          imagePullPolicy: Always
          ports:
            - containerPort: 80
