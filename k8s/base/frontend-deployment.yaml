apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-frontend
  labels:
    app: taskboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-frontend
  template:
    metadata:
      labels:
        app: taskboard-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/yassinbenslima/taskboard-frontend:sha-46069631f4da9c5c78c770f4238d14795f1ba6ab
          imagePullPolicy: Always
          ports:
            - containerPort: 80
